name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Default binaries — SIMD-accelerated by default via blake3 v0.4.0's go-asmgen
  # kernels (no GOEXPERIMENT, no cgo): NEON/SSE on arm64/amd64, LSX/RVV on
  # loong64/riscv64. The loong64/riscv64 vector assembly needs Go 1.25+, so the
  # whole matrix builds on the latest stable Go.
  stable:
    name: stable ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: loong64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          out="b3sum-${{ github.ref_name }}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/b3sum
          echo "ART=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}

  # Alternative SIMD build using Go's experimental archsimd intrinsics (amd64
  # AVX2, GOEXPERIMENT=simd, Go 1.26+) — a different implementation from the
  # default go-asmgen kernels above, kept for comparison. Bit-identical output.
  # ⛔ SET ASIDE until go-compressions/blake3#13 lands — see issue #13 here.
  #
  # This job pins Go 1.26.x on purpose: its whole subject is the Go 1.26 form of
  # GOEXPERIMENT=simd. Raising go.mod to 1.27.1 put the module's floor above the
  # toolchain the job exists to use, so it fails before building:
  #
  #   GOTOOLCHAIN: local
  #   go: go.mod requires go >= 1.27.1 (running go 1.26.8; GOTOOLCHAIN=local)
  #
  # GOTOOLCHAIN: local is why that is VISIBLE rather than silent — without it go
  # fetches 1.27.1 and builds something other than what this job claims to
  # compare. Keep it when this comes back.
  #
  # It cannot be fixed here. Go 1.27's simd has no Uint32x8 at all: the
  # fixed-lane types are gone, replaced by width-agnostic Uint32s plus
  # VectorBitSize() and Emulated(), so the kernels need a PORT, not a rename.
  # Restore this job, unchanged, once blake3 compiles under 1.27.
  #
  # simd-experimental:
  #   name: simd-experimental linux/amd64
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-go@v7
  #       with:
  #         go-version: '1.26.x'
  #         check-latest: true
  #     - name: Build (GOEXPERIMENT=simd)
  #       env:
  #         GOOS: linux
  #         GOARCH: amd64
  #         CGO_ENABLED: '0'
  #         GOEXPERIMENT: simd
  #       run: |
  #         out="b3sum-${{ github.ref_name }}-linux-amd64-simd-experimental"
  #         go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/b3sum
  #         echo "ART=$out" >> "$GITHUB_ENV"
  #     - uses: actions/upload-artifact@v7
  #       with:
  #         name: ${{ env.ART }}
  #         path: ${{ env.ART }}
  #

  publish:
    # NOT simd-experimental. That job is described two blocks up as
    # "kept for comparison", and a comparison must never be able to stop a
    # release. It did: v0.2.0 and v0.3.0 were tagged, 8 of 9 jobs were
    # green, publish was SKIPPED, and neither version has a GitHub release
    # or a single binary. See issue #13.
    needs: [stable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes
